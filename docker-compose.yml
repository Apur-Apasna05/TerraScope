services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terrascope-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrascope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrascope_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-terrascope}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrascope} -d ${POSTGRES_DB:-terrascope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrascope-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-terrascope}:${POSTGRES_PASSWORD:-terrascope_dev_password}@db:5432/${POSTGRES_DB:-terrascope}
      CONFIG_PATH: /app/config/terrascope.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrascope-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgis_data:
